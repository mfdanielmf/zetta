[project]
name = "backend"
version = "0.1.0"
description = "Zetta backend service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "fastapi>=0.139.0",
    "httpx2>=2.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "pytest>=9.1.1",
]
