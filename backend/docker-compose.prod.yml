services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-prod
    env_file:
      - .env
    environment:
      - ENVIRONMENT=prod
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - uploads_volume:/app/uploads
      - logs_volume:/app/logs
    restart: unless-stopped

volumes:
  uploads_volume:
    driver: local
  logs_volume:
    driver: local
